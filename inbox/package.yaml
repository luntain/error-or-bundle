name:                inbox
version:             0.2.0
synopsis:            Inbox for asychronous messages
description:         Facilitates testing of asynchronous behavior
homepage:            https://github.com/luntain/error-or-bundle/blob/master/inbox#readme
license:             BSD3
author:              Kamil Dworakowski
maintainer:          kamil@dworakowski.name
copyright:           2020 Kamil Dworakowski
category:            Testing
extra-source-files:
- README.md

tested-with: GHC ==8.6.5 || ==8.8.3 || ==8.10.2 || ==9.0.1 || ==9.2.1 || ==9.4.8 || ==9.6.6 || ==9.8.4 || ==9.10.3 || ==9.12.2
ghc-options: -Wall -Wunused-packages -fno-warn-name-shadowing
dependencies:
  - base >= 4.10 && < 5

library:
  source-dirs:      src
  dependencies:
  - text
  - error-or >= 0.2.0.0
  - stm

tests:
  inbox-tests:
    source-dirs: tests
    main: Tests.hs
    dependencies:
    - inbox
    - tasty
    - tasty-hunit
    - time
    ghc-options: -threaded -rtsopts -with-rtsopts=-N
