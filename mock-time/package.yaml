name:                mock-time
version:             0.2.0
synopsis:            Mock time in tests
description:         Control time in tests
homepage:            https://github.com/luntain/error-or-bundle/blob/master/mock-time#readme
license:             BSD3
maintainer:          kamil@dworakowski.name
author:              Kamil Dworakowski
copyright:           2025 Kamil Dworakowski
category:            Test
extra-source-files:
- README.md
- changelog.md

tested-with: GHC ==8.6.5 || ==8.8.3 || ==8.10.2 || ==9.0.1 || ==9.2.1 || ==9.4.8 || ==9.6.6 || ==9.8.4 || ==9.10.3 || ==9.12.2

dependencies:
  - base >= 4.10 && < 5
  - time

ghc-options: -Wall -Wunused-packages

library:
  source-dirs: src
  dependencies:
  - stm
  - mtl
  - transformers
  - exceptions
  - resourcet
  - primitive
  - unliftio-core
  ghc-options: -fno-warn-name-shadowing -fno-warn-orphans

tests:
  my-test-suite:
    source-dirs: tests
    main: Tests.hs
    dependencies:
    - mock-time
    - error-or
    - error-or-utils
    - tasty
    - tasty-quickcheck
    - tasty-hunit
    - QuickCheck
    - inbox
    ghc-options: -threaded -rtsopts -with-rtsopts=-N -Wno-type-defaults
